name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is offline. Reproducing the measurements needs
      # Postgres, the service container and several minutes of wall clock;
      # asserting them does not. The tests cover the decision logic, the cache,
      # the traffic generator and the error accounting as pure functions, plus
      # the shipped results/*.json as evidence, so CI stays fast and never
      # depends on a container registry being up.
      #
      # service/db.py needs psycopg, which is not installed here; the handler
      # test reaches it through a stub. The logic it serves is in
      # service/decide.py, and decide() itself is exercised against a fake
      # pool in tests/test_decide_path.py.
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10"

      - run: python -m pytest -q

      # Every number in the README is re-derived from results/*.json and must
      # appear verbatim. A re-run that shifts a figure fails here rather than
      # leaving the document silently wrong.
      - name: README numbers match the shipped results
        run: python scripts/check_readme_numbers.py
