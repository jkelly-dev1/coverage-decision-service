version: 2
updates:
  # The workflow pins each action to a commit SHA, so a moved tag cannot
  # change what CI runs. This entry is what keeps those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
